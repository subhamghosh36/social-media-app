<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectNow - Social Media</title>
  
  <!-- Tailwind CSS CDN for beautiful styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    /* Hide pages by default */
    .page { display: none; }
    .page.active { display: block; }
    body { background-color: #f9fafb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="antialiased text-gray-900">

  <!-- ================= LOGIN PAGE ================= -->
  <div id="loginPage" class="page flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-sm border border-gray-100 mt-20">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
        <p class="text-gray-500 mt-2">Sign in to your ConnectNow account</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-6">
        <div class="flex flex-col space-y-1">
          <label class="text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" class="px-3 py-2 border border-gray-300 rounded-md text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <div class="flex flex-col space-y-1">
          <label class="text-sm font-medium text-gray-700">Password</label>
          <input type="password" class="px-3 py-2 border border-gray-300 rounded-md text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <button type="submit" class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full font-medium transition-colors">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- ================= APP SHELL (Navbar + Sidebar + Main) ================= -->
  <div id="appShell" class="page">
    
    <!-- Navbar -->
    <nav class="fixed top-0 w-full bg-white border-b border-gray-100 z-50 px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 text-indigo-600 font-bold text-xl">
        <i data-lucide="globe" class="w-6 h-6"></i>
        <span>ConnectNow</span>
      </div>
      <button onclick="handleLogout()" class="px-4 py-2 border border-gray-200 rounded-full text-sm font-medium hover:bg-gray-50">
        Logout
      </button>
    </nav>

    <!-- Sidebar -->
    <aside class="fixed left-0 top-16 h-[calc(100vh-64px)] w-64 bg-white border-r border-gray-100 p-4 hidden md:block">
      <nav class="space-y-2">
        <button onclick="navigate('feed')" id="nav-feed" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left transition-colors text-indigo-600 bg-indigo-50 font-medium">
          <i data-lucide="home" class="w-5 h-5"></i> Home
        </button>
        <button onclick="navigate('profile')" id="nav-profile" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left transition-colors text-gray-600 hover:bg-gray-50 font-medium">
          <i data-lucide="user" class="w-5 h-5"></i> Profile
        </button>
        <button onclick="alert('Notifications feature coming soon!')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left transition-colors text-gray-600 hover:bg-gray-50 font-medium">
          <i data-lucide="bell" class="w-5 h-5"></i> Notifications
        </button>
        <button onclick="document.getElementById('postInput').focus()" class="w-full mt-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full font-medium transition-colors">
          Post
        </button>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="pt-16 md:pl-64 min-h-screen">
      <div class="max-w-2xl mx-auto p-4">
        
        <!-- FEED VIEW -->
        <div id="feedView" class="view">
          <h1 class="text-2xl font-bold text-gray-900 mb-6 hidden md:block">Home</h1>
          
          <!-- Create Post -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <div class="flex gap-4">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="w-10 h-10 rounded-full object-cover">
              <div class="flex-1">
                <textarea id="postInput" class="w-full bg-transparent resize-none outline-none text-gray-900 placeholder-gray-400 min-h-[60px] pt-2" placeholder="What's happening?"></textarea>
                
                <div id="imagePreviewContainer" class="relative mt-2 mb-4 hidden">
                  <img id="imagePreview" src="" class="rounded-xl max-h-64 w-auto object-cover">
                  <button onclick="removeImage()" class="absolute top-2 right-2 p-1 bg-black/50 hover:bg-black/70 text-white rounded-full">
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>
                </div>

                <div class="flex items-center justify-between border-t border-gray-50 pt-3 mt-2">
                  <div class="flex gap-2 text-indigo-500">
                    <button onclick="document.getElementById('fileInput').click()" class="p-2 hover:bg-indigo-50 rounded-full">
                      <i data-lucide="image" class="w-5 h-5"></i>
                    </button>
                    <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="previewImage(event)">
                  </div>
                  <button onclick="submitPost()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full font-medium">Post</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Feed Posts Container -->
          <div id="feedPosts"></div>
        </div>

        <!-- PROFILE VIEW -->
        <div id="profileView" class="view hidden">
          <div class="relative w-full h-48 md:h-64 bg-gray-200 rounded-b-2xl overflow-hidden">
            <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?w=1200&h=400&fit=crop" class="w-full h-full object-cover">
          </div>
          <div class="px-4 relative mb-8">
            <div class="flex justify-between items-end -mt-16 md:-mt-20 mb-4">
              <div class="relative w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-white overflow-hidden bg-white shadow-sm z-10">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=400&fit=crop" class="w-full h-full object-cover">
              </div>
              <div class="flex gap-2">
                <button onclick="alert('Followed Maya Chen!')" class="px-6 py-2 bg-gray-900 text-white rounded-full font-semibold hover:bg-gray-800">Follow</button>
                <button onclick="alert('Opening chat with Maya...')" class="px-6 py-2 border border-gray-200 rounded-full font-semibold hover:bg-gray-50">Message</button>
              </div>
            </div>
            <div class="mb-4">
              <h1 class="text-2xl font-bold text-gray-900">Maya Chen</h1>
              <p class="text-gray-500">@mayachen</p>
            </div>
            <p class="text-gray-800 mb-4 max-w-xl">Adventure seeker 🌿 | Digital Nomad | Lover of mountains, coffee, and code. Currently exploring Kyoto. ✨</p>
            <div class="flex gap-6 border-b border-gray-100 pb-6">
              <div class="flex flex-col"><span class="font-bold text-gray-900 text-lg">1,245</span><span class="text-gray-500 text-sm">Posts</span></div>
              <div class="flex flex-col"><span class="font-bold text-gray-900 text-lg">89.3K</span><span class="text-gray-500 text-sm">Followers</span></div>
              <div class="flex flex-col"><span class="font-bold text-gray-900 text-lg">612</span><span class="text-gray-500 text-sm">Following</span></div>
            </div>
          </div>
          <!-- Profile Posts -->
          <div id="profilePosts" class="px-4"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
